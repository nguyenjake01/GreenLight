# Per-run policy for the run-check sandbox (design doc §8.3 `sandbox`, §10 H6).
# OpenShell 0.0.116 schema: docs/reference/policy-schema.mdx.
#
# - No network: `network_policies` is empty, so nothing can leave the sandbox.
# - Landlock `hard_requirement`: sandbox startup aborts if Landlock is unavailable OR any
#   listed path cannot be opened. If a path below is missing from RUNCHECK_IMAGE, remove it
#   here; do NOT fall back to best_effort.
# - Only /work and /tmp (plus /dev/null) are writable; everything else is read-only.
# - Non-root: numeric uid/gid 1000 (must match the user and the /work owner in
#   docker/runcheck.Dockerfile).
# - Memory (4Gi) and CPU are set on `openshell sandbox create`, not in this file. The
#   256-PID limit is a gateway driver setting (`sandbox_pids_limit` in gateway config).
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /home      # else every exec's stderr starts with "~/.profile: Permission denied"
    - /dev/urandom
    - /dev/zero
  read_write:
    - /work
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies: {}
